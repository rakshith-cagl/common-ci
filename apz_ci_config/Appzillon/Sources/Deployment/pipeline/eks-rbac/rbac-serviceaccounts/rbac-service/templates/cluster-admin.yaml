{{ if .Values.rbac.clusterAdmin -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-admin-role
  labels:
{{ include "rbac-service.labels" . | indent 4 }}
rules:
  - apiGroups:
    - '*'
    resources:
      - '*'
    verbs:
      - '*'
  - nonResourceURLs:
    - '*'
    verbs:
      - '*'
{{- end -}}