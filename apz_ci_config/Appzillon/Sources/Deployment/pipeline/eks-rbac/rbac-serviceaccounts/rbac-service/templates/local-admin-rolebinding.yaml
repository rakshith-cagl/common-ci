{{ if .Values.rbac.localAdmin -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-admin-role-binding
  labels:
{{ include "rbac-service.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-admin-role
subjects:
  - kind: ServiceAccount
    name: local-admin
    namespace: {{ .Values.nameSpace }}
{{- end -}}


