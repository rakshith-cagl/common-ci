{{- if .Values.serviceAccount.create -}}
{{ if .Values.rbac.clusterAdmin -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-admin
  labels:
    {{- include "rbac-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}