kind: ConfigMap
apiVersion: v1
metadata:
  name: fluentd-elastic-conf
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/appzillon_logs/WebContainerLogs/WebContainerLogFile.log
      pos_file /tmp/WebContainerLogFile.log.pos
      tag WebContainerLogFile.access
      <parse>
        @type none
      </parse>
    </source>
    <source>
      @type tail
      path /var/log/appzillon_logs/MainLogFile.log
      pos_file /tmp/MainLogFile.log.pos
      tag MainLogFile.access
      <parse>
        @type none
      </parse>
    </source> 
    <match WebContainerLogFile.access>
      @type elasticsearch
      suppress_type_name true
      hosts https://172.31.38.29:9200,https://172.31.40.35:9200,https://172.31.41.60:9200
      scheme https
      ca_file /fluentd-elastic-tls/appzillon-ca.crt
      client_cert /fluentd-elastic-tls/appzillon.crt
      client_key /fluentd-elastic-tls/appzillon.key
      ssl_version TLSv1_3
      user "#{ENV['ES_USERNAME']}"
      password "#{ENV['ES_PASSWORD']}"
      index_name weblog
      logstash_format true
      logstash_prefix weblog
      logstash_dateformat %Y%m%d
      flush_interval 1s
    </match>
    <match MainLogFile.access>
      @type elasticsearch
      suppress_type_name true
      hosts https://172.31.38.29:9200,https://172.31.40.35:9200,https://172.31.41.60:9200
      scheme https
      ca_file /fluentd-elastic-tls/appzillon-ca.crt
      client_cert /fluentd-elastic-tls/appzillon.crt
      client_key /fluentd-elastic-tls/appzillon.key
      ssl_version TLSv1_3
      user "#{ENV['ES_USERNAME']}"
      password "#{ENV['ES_PASSWORD']}"
      index_name serverlog
      logstash_format true
      logstash_prefix serverlog
      logstash_dateformat %Y%m%d
      flush_interval 1s
    </match>