apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "fluentd-daemon-elastic.fullname" . }}
  namespace: {{ .Values.nameSpace }}
  labels:
    k8s-app: fluentd-logging
    version: v1
spec:
  selector:
    matchLabels:
      k8s-app: fluentd-logging
      version: v1
  template:
    metadata:
      labels:
        k8s-app: fluentd-logging
        version: v1
    spec:
      serviceAccount: {{ .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      containers:
      - name: fluentd-elastic
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        env:
        - name: ES_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: elastic-secret
        - name: ES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: elastic-secret
        - name: NAMESPACE
          value: {{ .Values.nameSpace }}
        - name: SERVER_APP
          value: {{ .Values.serverApp }}
        - name : WEB_APP
          value: {{ .Values.webApp }}
        volumeMounts:
          - name: fluentd-config
            mountPath: /fluentd/etc/
          - name: fluentd-elastic-ssl
            readOnly: true
            mountPath: /fluentd-elastic-tls/
          - name: varlog
            mountPath: /var/log
          - name: dockercontainerlogdirectory
            mountPath: /var/lib/docker/containers
            readOnly: true

      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      volumes:
        - name: fluentd-config
          configMap:
            name: fluentd-elastic-conf 
        - name: fluentd-elastic-ssl
          secret:
            secretName: fluentd-elastic-tls
        - name: varlog
          hostPath:
            path: /var/log
        - name: dockercontainerlogdirectory
          hostPath:
            path: /var/lib/docker/containers
         