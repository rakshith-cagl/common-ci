# Default values for fluentbit.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: 169639270777.dkr.ecr.us-east-1.amazonaws.com/fluentbit
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v1.5"

imagePullSecrets:
  - name: ""
nameOverride: ""
fullnameOverride: ""


username: ""
password: ""
appzilloncaCrt: ""
appzillonCrt: ""
appzillonKey: ""
registry: ""

openshift:
  cluster: false

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "fluentbit"

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specisecurou do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# default values
ports:
  containerPort: 2020

terminationGracePeriodSeconds: 10

nameSpace: "develop"
serverApp: "staging-develop-eks-appzillon-adminserver"
webApp: "staging-develop-eks-appzillon-admin"
elasticHost: "haproxy.apzplatforms.com"
elasticPort: "9200"
