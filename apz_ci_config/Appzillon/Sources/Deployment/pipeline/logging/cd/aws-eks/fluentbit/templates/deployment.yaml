apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "fluentbit.fullname" . }}
  namespace: {{ .Values.nameSpace }}
  labels:
    k8s-app: {{ include "fluentbit.name" . }}
    version: v1
    kubernetes.io/cluster-service: "true"
spec:
  selector:
    matchLabels:
      k8s-app: {{ include "fluentbit.name" . }}
  template:
    metadata:
      labels:
        k8s-app: {{ include "fluentbit.name" . }}
        version: v1
        kubernetes.io/cluster-service: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: fluent-bit
        {{- if .Values.openshift.cluster }}
        securityContext:
          privileged: true
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - containerPort: {{ .Values.ports.containerPort }}
        env:
        - name: ES_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: elastic-secret
        - name: ES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: elastic-secret
        - name: FLUENT_ELASTICSEARCH_HOST
          value: {{ .Values.elasticHost | quote}}
        - name: FLUENT_ELASTICSEARCH_PORT
          value: {{ .Values.elasticPort | quote}}
        - name: NAMESPACE
          value: {{ .Values.nameSpace }}
        - name: SERVER_APP
          value: {{ .Values.serverApp }}
        - name : WEB_APP
          value: {{ .Values.webApp }}
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
        - name: fluentbit-elastic-ssl
          readOnly: true
          mountPath: /fluentbit-elastic-tls/
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
      - name: fluentbit-elastic-ssl
        secret:
          secretName: fluentbit-elastic-tls
      serviceAccountName: {{ include "fluentbit.serviceAccountName" . }}
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - operator: "Exists"
        effect: "NoExecute"
      - operator: "Exists"
        effect: "NoSchedule"
