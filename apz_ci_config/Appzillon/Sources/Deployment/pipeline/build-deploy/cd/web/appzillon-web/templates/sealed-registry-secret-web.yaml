{{- if .Values.openshift.cluster }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  creationTimestamp: null
  name: {{ lower .Values.appId }}-registry-secret-web
  namespace: {{ .Values.nameSpace }}
spec:
  encryptedData:
    .dockerconfigjson: {{ index (index .Values .Values.appId) "registryWeb" }}
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      creationTimestamp: null
      name: {{ lower .Values.appId }}-registry-secret-web
      namespace: {{ .Values.nameSpace }}
    type: kubernetes.io/dockerconfigjson
{{- end }}
