apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  creationTimestamp: null
  name: {{ lower .Values.appId }}-redis-secret
  namespace: {{ .Values.nameSpace }}
spec:
  encryptedData:
    redis_truststore.jks: {{ index (index .Values .Values.appId) "redisSecret" }}
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      creationTimestamp: null
      name: {{ lower .Values.appId }}-redis-secret
      namespace: {{ .Values.nameSpace }}