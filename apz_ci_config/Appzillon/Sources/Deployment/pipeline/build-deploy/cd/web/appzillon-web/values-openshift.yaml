# Default values for appzillon-web.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 169639270777.dkr.ecr.us-east-1.amazonaws.com/appzillon-admin
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v1"

imagePullSecrets:
  - name: ""
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "appzillon"

podAnnotations:
  prometheus.io/port: "8871"
  prometheus.io/scrape: "true"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  #type: LoadBalancer
  port: 9090

ingress:
  enabled: true
  annotations: 
     kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: tsb-eks-admin.apzplatforms.com
      paths: 
        - /AppzillonAdmin
  tls: 
    - secretName:  admin-tls-secret-web
      hosts:
        - tsb-eks-admin.apzplatforms.com

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 300m
    memory: 1000Mi
  requests:
    cpu: 100m
    memory: 350Mi

# default values
ports:
  containerPort: 9090
  protocol: TCP

liveness:
  port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 2

readiness:
  port: http
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 2

terminationGracePeriodSeconds: 60

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}


contextPath: AppzillonAdmin
envMountPath: /opt/apache-tomcat-9.0.46/lib
appId: Admin


# parameters for sealed secrets

nameSpace: default
# Certs data with App ID
Admin: 
  appzillonJks: ""
  publicPem: ""
  redisSecret: ""
  redisCreds: ""
  tlsCrt: ""
  tlsKey: ""
  registryWeb: ""

Admin2:
  appzillonJks: ""
  publicPem: ""
  redisSecret: ""
  redisCreds: ""
  tlsCrt: ""
  tlsKey: ""
  registryWeb: ""

openshift:
  cluster: false
