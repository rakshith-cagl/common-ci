apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  creationTimestamp: null
  name: {{ lower .Values.secretAppTag }}-db-secret
  namespace: {{ .Values.nameSpace }}
spec:
  encryptedData:
    passwd: {{ index (index .Values .Values.serverWarName) "dbPasswd" }}
    username: {{ index (index .Values .Values.serverWarName) "dbUsername" }}
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      creationTimestamp: null
      name: {{ lower .Values.secretAppTag }}-db-secret
      namespace:  {{ .Values.nameSpace }}

