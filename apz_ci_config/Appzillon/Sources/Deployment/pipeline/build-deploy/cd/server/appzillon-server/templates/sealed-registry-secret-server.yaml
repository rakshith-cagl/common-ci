{{- if .Values.openshift.cluster }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  creationTimestamp: null
  name: {{ lower .Values.secretAppTag }}-registry-secret-server
  namespace: {{ .Values.nameSpace }}
spec:
  encryptedData:
    .dockerconfigjson: {{ index (index .Values .Values.serverWarName) "registryServer" }}
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      creationTimestamp: null
      name: {{ lower .Values.secretAppTag }}-registry-secret-server
      namespace: {{ .Values.nameSpace }}
    type: kubernetes.io/dockerconfigjson
{{- end }}
