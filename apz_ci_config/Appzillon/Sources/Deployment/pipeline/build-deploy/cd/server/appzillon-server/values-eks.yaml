# Default values for appzillon-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 169639270777.dkr.ecr.us-east-1.amazonaws.com/appzillon-admin-server
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v1"

imagePullSecrets: {}
nameOverride: ""
fullnameOverride: ""

serviceAccount: 
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "appzillon"

podAnnotations:
  prometheus.io/port: "8871"
  prometheus.io/scrape: "true"

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  #runAsNonRoot: false
  #runAsUser: 1000

service:
  type: ClusterIP
  port: 9090

kong: true




ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/group.name: appzillon-group
  ## SSL Settings
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:325617413693:certificate/86fc6620-7c3f-4a00-b237-3a6f12bc71d1

  kong:
    annotations:
      kubernetes.io/ingress.class: kong

  hosts:
    - host: tsb-eks-adminserver.apzplatforms.com
      paths: 
        - /AppzillonServer/Appzillon
  # tls:
  #   - secretName: admin-tls-secret-server
  #     hosts:
  #       - tsb-eks-adminserver.apzplatforms.com





mounts:
  - appid:
      - Admin
      - Admin2


resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
   limits:
     cpu: 500m
     memory: 2000Mi
   requests:
     cpu: 100m
     memory: 730Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# default values

ports:
  containerPort: 9090
  protocol: TCP

liveness:
  port: http
  initialDelaySeconds: 120
  periodSeconds: 10

readiness:
  port: http
  initialDelaySeconds: 180
  periodSeconds: 10

terminationGracePeriodSeconds: 60

nameSpace: appzillon-develop
contextPath: /AppzillonServer/Appzillon
secretAppTag: common
envMountPath: /opt/apache-tomcat-9.0.46/lib
serverWarName: AppzillonServer
appID: Admin
uploadPath: /var/app_volume/uploads
pvcUploadName: efs-logpvc
dbsslMode:
  enabled: true
reports:
  enabled: true 
  path: /var/app_volume/reports
  pvcReportsName: pvc-nfs-reports


# parameters for sealed secrets

# Certs data
AppzillonServer: #Server War Name
  dbUsername: ""
  dbPasswd: ""
  extCliJks: ""
  extCliJksPassd: ""
  privatePem: ""
  tlsCrt: ""
  tlsKey: ""
  postgres_clientCrt: ""
  rootCACrt: ""
  registryServer: ""

dbsslMode:
  enabled: true

openshift:
  cluster: false

# parameters for configmap

host: "jdbc:postgresql://172.31.40.40:5432/mytestdb?sslmode=verify-full&sslcert=/opt/apache-tomcat-9.0.46/lib/AppzillonServer/certs/psql-cli-cert/postgres_client.crt&sslkey=/opt/postgres_client.key.pk8&sslrootcert=/opt/apache-tomcat-9.0.46/lib/AppzillonServer/certs/psql-cli-cert/rootCA.crt"
driverClassName: "org.postgresql.Driver"
