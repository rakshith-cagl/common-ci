# AWS EBS Storage
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: aws-appzillon-logpv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  awsElasticBlockStore:
    fsType: ext4
    volumeID: vol-0235ff0955dafa667

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: aws-appzillon-logpvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  volumeName: aws-appzillon-logpv

