# Cluster Host Path Storage
---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: "appzillon-upload-logpv"
spec:
  capacity:
    storage: 2Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gp2
  hostPath:
    path: "/var/app_volume/uploads"

---
kind: PersistentVolumeClaim                                                 
apiVersion: v1
metadata:
  name: "appzillon-upload-logpvc"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  volumeName: "appzillon-upload-logpv"


---
kind: PersistentVolume
apiVersion: v1
metadata:
  name:  "appzillon-web-server-logpv"
spec:
