---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: appzillon
  namespace: appzillon-develop
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: appzillon-role
  namespace: appzillon-develop
rules:
  - verbs:
      - get
      - list
      - update
      - watch
    apiGroups:
      - apps
      - extensions
    resources:
      - deployments
  - verbs:
      - update
    apiGroups:
      - apps
      - extensions
    resources:
      - deployments/status
  - verbs:
      - update
    apiGroups:
      - apps
      - extensions
    resources:
      - deployments/finalizers
  - verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
    apiGroups:
      - apps
      - extensions
    resources:
      - replicasets
  - verbs:
      - get
      - list
      - update
      - watch
    apiGroups:
      - ''
    resources:
      - pods
  - verbs:
      - create
      - patch
      - update
    apiGroups:
      - ''
      - events.k8s.io
    resources:
      - events
  - verbs:
      - get
    apiGroups:
      - ''
    resources:
      - pods/log
  - verbs:
      - create
      - update
    apiGroups:
      - ''
      - image.openshift.io
    resources:
      - imagestreamtags
      - imagetags
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: appzillon-binding
  namespace: appzillon-develop
subjects:
  - kind: ServiceAccount
    name: appzillon  
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: appzillon-role