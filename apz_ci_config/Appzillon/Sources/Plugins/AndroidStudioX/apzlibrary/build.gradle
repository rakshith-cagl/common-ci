apply plugin: 'com.android.library'

android {
    compileSdkVersion 28
    buildToolsVersion "26.0.3"
    defaultConfig {
        minSdkVersion 19
        multiDexEnabled true
        targetSdkVersion 28
        versionCode ANDVERSIONCODE
        versionName "APPVERSION"
       testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
	/*signingConfigs {
 release {
 storeFile file("demoapp.keystore")
 storePassword 'samsung'
keyAlias 'samsung'
keyPassword 'samsung'
}
 }

    buildTypes {
        release {
		 signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }*/

	splits {
        abi {
            enable false
            reset()
            include 'armeabi-v7a','arm64-v8a','x86','x86_64'
            universalApk true
        }
    }


    aaptOptions {
        cruncherEnabled = false
    }
    repositories {
        //mavenCentral()
        //maven { url 'https://maven.fabric.io/public' }
        //maven { url "https://maven.google.com" }
		//maven {
        //    url "https://s3.amazonaws.com/repo.commonsware.com"
        //}
    }

    lintOptions {
        abortOnError false
    }

    sourceSets { main { assets.srcDirs = ['src/main/assets', 'assets/'] } }
    useLibrary 'org.apache.http.legacy'
}

dependencies {

    compile fileTree(dir: 'libs', include: ['*.jar'])
 androidTestCompile('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    compile 'com.commonsware.cwac:provider:0.4.3'

    compile 'androidx.appcompat:appcompat:1.0.0'
    compile 'androidx.legacy:legacy-support-v4:1.0.0'
    compile 'androidx.constraintlayout:constraintlayout:1.1.3'
    testCompile 'junit:junit:4.12'
    compile 'com.google.android.gms:play-services-location:17.0.0'
    compile 'org.apache.commons:commons-lang3:3.6'
    compile 'com.scottyab:rootbeer-lib:0.0.7'
    compile 'androidx.multidex:multidex:2.0.0'
    androidTestImplementation 'androidx.multidex:multidex-instrumentation:2.0.0'
	APPZILLONDEPENDENCIES
}

