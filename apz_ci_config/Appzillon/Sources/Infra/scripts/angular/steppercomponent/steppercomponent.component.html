<ng-template #stepperContent>
    <ng-container >
        
        <ul #steppearWrapper>
          <li>
            <button  aria-label="Minus" (click)="handleStepper($event)"
             #stepperleftButton>
              <svg [attr.class]="props.leftIcon.direct.className"  aria-hidden="true" #stepperleftIcon>
                <use [attr.xlink:href]="'#'+props.leftIcon.name" xlink:href="" />
              </svg>
            </button>
          </li>
          <li>
            <ng-container *ngIf="isUiElm()">
                
                <input [id]="id"  [(value)] ="props.value"  [attr.rowno]="(this.rowIndex != undefined) ?this.rowIndex:-1"  (blur)="apz.validateStepperVal($event.target); validateThevalues($event.target)" #stepperInputContent delegateEvent [blurEvent]="blur" [focusEvent]="focus" />            
            </ng-container>
            <ng-container *ngIf="!isUiElm()">
                    <input [id]="id"  [(ngModel)] ="values[elm]"  [attr.rowno]="(this.rowIndex != undefined) ?this.rowIndex:-1" (blur)="apz.validateStepperVal($event.target);validateThevalues($event.target)" (blur)="setHandler()" #stepperInputContent delegateEvent [blurEvent]="blur" [focusEvent]="focus"/> 
            </ng-container>
 
          </li>
          <li>
            <button  aria-label="Plus" (click)="handleStepper($event)"
            #stepperRightButton>
              <svg [attr.class]="props.rightIcon.direct.className" aria-hidden="true" #stepperRightIcon>
                <use [attr.xlink:href]="'#' + props.rightIcon.name" xlink:href=""/>
              </svg>
            </button>
          </li>
        </ul>
        <ng-container *ngIf="props.StepperHintRequired === 'Y'">
            <ng-container [ngTemplateOutlet]="hintContent">
            </ng-container>  
        </ng-container>    
    </ng-container>

</ng-template>

<ng-template #hintContent>
    <span [id]="id+'_hnt'" class="htx">{{props.stepperHint.value}}</span>
</ng-template>


<ng-container *ngIf="props.cntrType=='FORM' ">
        <ul #stepperFormWrapperClass  id="{{props.id + '_ul'}}" clickstoppropagation>
            <li  #stepperFormlabelWrapper>
            	<ng-container *ngIf="(props.hasLabelIcon === 'Y' && props.labelIconProps.iconPos==='LEFT')"  [ngTemplateOutlet]="labelIconContent">
            	</ng-container>
                <label #stepperFormlabelProps  [innerHtml]="props.labelProps.title">
                </label>
                <ng-container *ngIf="(props.hasLabelIcon === 'Y' && props.labelIconProps.iconPos!=='LEFT')"  [ngTemplateOutlet]="labelIconContent">
            	</ng-container>
            </li>
            <li #stepperFormContentWrapper>
                <span #stepperFormSpanWrapper >
                        <ng-container [ngTemplateOutlet]="stepperContent">
                        </ng-container>
                </span>
            </li>
        </ul>
</ng-container>
    
<ng-container *ngIf="props.cntrType == 'NAVBAR' || props.cntrType == 'LIST'">
            <span #navSapnwrapper >
                <ng-container [ngTemplateOutlet]="stepperContent">
                </ng-container>
            </span>            
</ng-container>
<ng-container *ngIf= "props.cntrType=='TABLE'">
        <td [attr.id]="('td_'+ props.id + '_' + rowIndex)" class="{{props.tdClasses}}">
                <span [id]="(props.id + '_span_'+ rowIndex)"  #tableSpanWrapper>
                   <ng-container [ngTemplateOutlet]="stepperContent"></ng-container>
                </span>
        </td>
</ng-container>

<ng-template #labelIconContent>
    <button class="ett-bttn tsp sml lbtn px20" (click)="iconClickEvent($event)">
        <svg [attr.class]="props.labelIconProps.direct.className" #contentIcon>
            <use attr.xlink:href="{{'#'+ props.labelIconProps.name}}" xlink:href="" />
        </svg>
    </button>
</ng-template>
