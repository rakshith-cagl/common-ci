<ng-container *ngIf="props.cntrType == 'FORM'">
        <ul id="{{props.id}} + '_ul'" #wrapperClasses clickstoppropagation>
            <li #labelWrapper >
                <label #labelProps [innerHtml]="props.labelProps.title">
                </label>
            </li>
            <li #contentWrapper>
                    <ng-container *ngTemplateOutlet="dropdownbtnbody"></ng-container>
            </li>
        </ul>
</ng-container>

<ng-container *ngIf="props.cntrType == 'NAVBAR'">
    <span #spanWrapper >
        <ng-container *ngTemplateOutlet="dropdownbtnbody"></ng-container>  
    </span>
</ng-container>

<ng-template #dropdownbtnbody>
    <div [id]="id + '_ext'" class="{{apprCls+' '+alignment+' '+tooltipCls+' '+cssCls+' '+snoCls+' '+widthCls+' '+disabledCls+'ett-drdn etb-drdn'}}"
        (click)="handleClick($event.currentTarget,$event)">
        <button [id]="id"  class="{{'drdn '+alignment+' '+disabledCls}}" delegateEvent [blurEvent]="blur" [focusEvent]="focus">{{value}}</button>
        <span>
            <svg class="ett-icon icon-down px34">
                <use xlink:href="#icon-down"></use>
            </svg>
        </span>
        <div [id]="id + '_div'" class="drdn-list">
            <ul role="menu">
                <ng-container *ngFor="let option of statOpts;let i=index">
                    <li>
                        <a href="{{option.value}}" target= "_blank" [attr.key]="i">{{option.description}}</a>
                    </li>
                </ng-container>
            </ul>
        </div>
    </div>
</ng-template>
