<ng-container *ngIf="props.cntrType=='FORM' ">
        <ul #formWrapperClass  id="{{props.id}} + _ul" clickstoppropagation>
            <li  #formlabelWrapper >
                <label #formlabelProps [innerHtml]="props.labelProps.title">
                </label>
            </li>
            <li #formContentWrapper >
                <span ><!-- #formSpanWrapper  -->
                   
                        <svg [id]="id"  aria-hidden="true" [attr.rowno]="index" [attr.class]="props.IconContent.direct.className" 
                        #apzEvent delegateEvent [blurEvent]="blur" [focusEvent]="focus" [attr.original-title]="originalTitle">  
                            <use attr.xlink:href="{{'#' + props.IconContent.name}}" xlink:href=""></use>
                        </svg> 
            
                    <ng-container *ngIf="props.IconHintRequired == 'Y'">
                        <span id="{{id + '_hnt'}}" class="htx">
                            {{props.ImageHint.value}}
                        </span>
                    </ng-container>
                </span>
            </li>
        </ul>
</ng-container>


<ng-container *ngIf="props.cntrType == 'NAVBAR' || props.cntrType == 'LIST'">
       
          
                <svg [id]="id"  aria-hidden="true" [attr.rowno]="index" [attr.class]="props.IconContent.direct.className" 
                delegateEvent [blurEvent]="blur" [focusEvent]="focus" #apzEvent>
                    <use attr.xlink:href="{{'#' + props.IconContent.name}}" xlink:href=""></use>
                </svg>
            
            <ng-container *ngIf="props.IconHintRequired == 'Y'">
                <span id="{{id + '_hnt'}}" class="htx">
                    {{props.ImageHint.value}}
                </span>
            </ng-container> 
       
</ng-container>

<ng-container *ngIf= "props.cntrType=='TABLE'">
        <td [attr.id]="(rowIndex != undefined) ?('td_'+ props.id + '_' + rowIndex):('td_'+ props.id)" class="{{props.tdClasses}}">
                <span>
                    
                        <svg [id]="id"  aria-hidden="true" [attr.rowno]="index" [attr.class]="props.IconContent.direct.className"
                        delegateEvent [blurEvent]="blur" [focusEvent]="focus" #apzEvent>
                            <use attr.xlink:href="{{'#' + props.IconContent.name}}" xlink:href=""></use>
                        </svg>
                    
                    <ng-container *ngIf="props.IconHintRequired == 'Y'">
                        <span id="{{id + '_hnt'}}" class="htx">
                            {{props.ImageHint.value}}
                        </span>
                    </ng-container> 
                </span>
        </td>
</ng-container>
