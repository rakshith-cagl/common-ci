<ng-template #textAreaContent>
<ng-container *ngIf="props.hasLov === 'Y' else textArea">
    <span #textSpanWrapper>
        <span #elmSpanWrapper> 

            <ng-container *ngIf="props.iconPosition === 'LEFT'">
                <ng-container [ngTemplateOutlet]="textAreaIcon"></ng-container>
            </ng-container>
            <span>
                <ng-container [ngTemplateOutlet]="textArea"></ng-container>
      
            </span>

            <ng-container *ngIf="props.iconPosition === 'RIGHT'">
                <ng-container [ngTemplateOutlet]="textAreaIcon"></ng-container>
            </ng-container>    
        </span>			
    </span>
</ng-container>
</ng-template>
<ng-template #textArea>
            <ng-container *ngIf="!isUiElm()">   
                <textarea (change)="onChange($event)"  (blur) ="onBlur($event)" [id]="id" [ngStyle]="props.hasLov === 'Y' ? props.eleStyle:null" [attr.rowno]="index" [(ngModel)]="values[elm]"
                (change)="setHandler()" delegateEvent [blurEvent]="blur" [focusEvent]="focus"  attr.rowno="{{index}}" #textAreaElement>
                </textarea>
            </ng-container> 
            <ng-container *ngIf="isUiElm()">
                <textarea [id]="id" #textAreaElement value="props.value" attr.rowno="{{index}}" delegateEvent [blurEvent]="blur" [focusEvent]="focus"></textarea>
            </ng-container>
</ng-template>
<ng-template #textAreaIcon>
        <span class="etw-5" #textAreaIconButtonWrapper > <!-- {...props.btnWrapper.direct} -->
                <button [id]="id + '_lov'" (click)="onClick()" title="List of Values"  aria-label="LOV">
                    <svg class="ett-icon px24" aria-hidden="true" >
                        <use attr.xlink:href="{{'#'+props.buttonIcon.direct.name}}"></use>	
                    </svg>
                </button>
            </span>	
</ng-template>


<ng-container *ngIf="props.cntrType=='FORM' ">
        <ul #textAreaFormWrapperClass  id="{{props.id + '_ul'}}" clickstoppropagation>
            <li  #textAreaFormlabelWrapper>
            	<ng-container *ngIf="(props.hasLabelIcon === 'Y' && props.labelIconProps.iconPos==='LEFT')"  [ngTemplateOutlet]="labelIconContent">
            	</ng-container>
                <label #textAreaFormlabelProps  [innerHtml]="props.labelProps.title">
                </label>
                <ng-container *ngIf="(props.hasLabelIcon === 'Y' && props.labelIconProps.iconPos!=='LEFT')"  [ngTemplateOutlet]="labelIconContent">
            	</ng-container>
            </li>
            <li #textAreaFormContentWrapper >
                <span #textAreaFormSpanWrapper >
                        <ng-container [ngTemplateOutlet]="textAreaContent">
                        </ng-container>
                </span>
            </li>
        </ul>
</ng-container>
    
<ng-container *ngIf="props.cntrType == 'NAVBAR' || props.cntrType == 'LIST'">
            <span #navSapnwrapper >
                <ng-container [ngTemplateOutlet]="textAreaContent">
                </ng-container>
            </span>            
</ng-container>
<ng-container *ngIf= "props.cntrType=='TABLE'">
    
        <td [attr.id]="('td_'+ props.id + '_' + rowIndex)" class="{{props.tdClasses}}">
                <span [id]="(props.id + '_span_'+ rowIndex)" #tableSpanWrapper>
                   <ng-container [ngTemplateOutlet]="textAreaContent"></ng-container>
                </span>
        </td>
</ng-container>

<ng-template #labelIconContent>
    <button class="ett-bttn tsp sml lbtn px20" (click)="iconClickEvent($event)">
        <svg [attr.class]="props.labelIconProps.direct.className" #contentIcon>
            <use attr.xlink:href="{{'#'+ props.labelIconProps.name}}" xlink:href="" />
        </svg>
    </button>
</ng-template>
